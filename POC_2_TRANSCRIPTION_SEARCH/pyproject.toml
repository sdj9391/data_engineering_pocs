[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-search"
version = "0.1.0"
description = "Search training transcripts with Google Cloud Discovery Engine"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "google-cloud-discoveryengine",
]

[tool.setuptools.packages.find]
include = ["transcript_search*"]
