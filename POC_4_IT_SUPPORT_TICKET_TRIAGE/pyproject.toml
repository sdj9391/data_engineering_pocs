[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "it-support-ticket-triage"
version = "0.1.0"
description = "An IT support ticket triage and routing assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pg8000",
    "cloud-sql-python-connector[pg8000]",
    "google-genai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["it_support_ticket_triage*"]

[tool.setuptools.package-data]
it_support_ticket_triage = ["ui/*.html"]
