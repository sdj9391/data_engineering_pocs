<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>IT Ticket Triage</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 12px}
  input,textarea,button{width:100%;box-sizing:border-box;padding:10px;font-size:15px;margin:4px 0}
  button{cursor:pointer;width:auto;padding:10px 22px}
  .card{border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin-top:16px}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;color:#fff;font-weight:600}
  .ok{background:#16a34a}.human{background:#d97706}
  .row{margin:6px 0}.row b{display:inline-block;min-width:170px}
  .muted{color:#666;font-size:14px}
</style></head><body>
<h2>IT Support Ticket Triage</h2>
<input id="subject" placeholder="Subject" maxlength="200">
<textarea id="desc" rows="5" placeholder="Describe the problem..." maxlength="4000"></textarea>
<button id="go">Triage ticket</button>
<div id="out"></div>

<script>
const $ = id => document.getElementById(id);

const row = (parent, label, value) => { const d = document.createElement("div"); d.className = "row"; const b = document.createElement("b"); b.textContent = label; d.append(b, document.createTextNode(value)); parent.appendChild(d); };

$("go").onclick = async () => {
  const out = $("out"); out.textContent = "Working...";
  try {
    const r = await fetch("/triage", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({subject: $("subject").value, description: $("desc").value})});
    if (!r.ok) throw new Error(r.status + " " + (await r.text()));
    const d = await r.json(), rt = d.routing, p = d.priority, i = d.intake, kb = d.knowledge_base;
    out.textContent = "";
    const card = document.createElement("div"); card.className = "card";
    const badge = document.createElement("span"); badge.className = "badge " + (rt.decision === "ASSIGN_TEAM" ? "ok" : "human");
    badge.textContent = rt.decision === "ASSIGN_TEAM" ? "Assigned: " + rt.team : "Needs human triage";
    card.appendChild(badge);
    row(card, "Category", i.category + " (confidence " + i.category_confidence.toFixed(2) + ", via " + i.source + ")");
    row(card, "Key phrases", i.key_phrases.join(", ") || "none");
    row(card, "Priority", p.priority + (rt.urgent ? " (URGENT)" : "") + ", target response " + rt.target_response_hours + "h");
    row(card, "Priority reasons", p.reasons.join("; "));
    row(card, "Similar past tickets", p.avg_resolution_hours === null ? "no history" : "avg " + p.avg_resolution_hours + "h over " + p.similar_resolved_tickets + " (" + p.resolution_basis + ")");
    row(card, "Suggested KB article", kb ? kb.kb_id + " " + kb.title + " (score " + kb.score + ")" : "none");
    if (kb) row(card, "Article steps", kb.body);
    row(card, "Routing reasons", rt.reasons.join("; "));
    out.appendChild(card);
  } catch (err) { out.textContent = "Error: " + err.message; }
};
</script></body></html>
